<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investment Heilbronn – Winter Semester 2026/27</title>
<style>
:root{--bg:#000;--panel:#101310;--line:#26302a;--text:#f3f6f1;--mute:#9aa89c;--g:#2ee27a;--b:#3d8bff;--y:#ffd21f;--n:#d9ded8;--on:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#f3f6f1;--line:#d3dbd2;--text:#000;--mute:#4d5b50;--g:#0d9c4a;--b:#1f64d6;--y:#e0aa00;--n:#222;--on:#fff}}
:root[data-theme="light"]{--bg:#fff;--panel:#f3f6f1;--line:#d3dbd2;--text:#000;--mute:#4d5b50;--g:#0d9c4a;--b:#1f64d6;--y:#e0aa00;--n:#222;--on:#fff}
:root[data-theme="dark"]{--bg:#000;--panel:#101310;--line:#26302a;--text:#f3f6f1;--mute:#9aa89c;--g:#2ee27a;--b:#3d8bff;--y:#ffd21f;--n:#d9ded8;--on:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Space Grotesk","Segoe UI",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--g);padding-bottom:16px}
h1{margin:0;font-size:clamp(28px,6vw,48px);line-height:1.05;letter-spacing:-.02em}
h1 span{display:block;color:var(--g);font-size:.55em;letter-spacing:0;font-weight:500;margin-top:6px}
.btn{background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover,.btn[aria-pressed=true]{border-color:var(--text)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.next{margin:20px 0;padding:14px 16px;background:var(--y);color:#000;border-radius:8px;display:none;cursor:pointer;font-weight:600}
.next small{display:block;font-weight:400}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin:16px 0}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--text);color:var(--on);border-color:var(--text)}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{color:var(--mute);font-size:12px;text-align:center;padding:4px 0}
.cell{min-height:64px;background:var(--panel);border-radius:6px;padding:6px;font-size:13px;color:var(--mute);border:1px solid transparent;text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:4px}
.cell.off{background:none}
.cell.ev{color:var(--text);cursor:pointer;border-color:var(--line)}
.cell.ev:hover,.cell.sel{border-color:var(--c)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--c)}
.cell.brk{background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 6px,var(--bg) 6px,var(--bg) 12px)}
.cell b{width:100%;height:5px;border-radius:3px;background:var(--c)}
.cell em{font-style:normal;font-size:11px;line-height:1.2;display:none}
.cell.today{border-color:var(--text)}
@media(min-width:700px){.cell{min-height:92px}.cell em{display:block}}
.detail{margin-top:20px;border:1px solid var(--line);border-left:8px solid var(--c,var(--g));border-radius:8px;padding:18px;background:var(--panel)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--c);color:#000}
.detail h2{margin:8px 0 4px;font-size:22px}
.detail .d{color:var(--mute);margin:0 0 10px}
.detail p{margin:6px 0;max-width:70ch}
.detail strong{color:var(--c)}
.list{margin-top:24px;display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;background:none;color:var(--text);font:inherit;cursor:pointer}
.row:hover{background:var(--panel)}
.row .dt{min-width:52px;font-weight:700;font-size:14px}
.note{color:var(--mute);font-size:14px;margin-top:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;padding:44px 24px 64px}
header{border-bottom:1px solid var(--line);padding-bottom:24px}
h1{font-size:clamp(26px,4.5vw,40px);font-weight:700;letter-spacing:-.03em}
h1 span{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:10px}
h1 span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:8px}
.btn{border-radius:8px;color:var(--mute);font-weight:500}
.btn:hover{color:var(--text)}
.next{background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:12px;padding:16px 18px;margin:28px 0 8px;font-weight:600}
.next small{color:var(--mute);margin-top:2px}
.bar{margin:24px 0 16px;align-items:center}
.tabs{background:var(--panel);padding:4px;border-radius:10px;gap:2px;border:1px solid var(--line)}
.tab{border:0;padding:7px 16px;color:var(--mute);font-weight:500;border-radius:7px}
.tab[aria-selected=true]{background:var(--text);color:var(--on)}
.chip{background:var(--panel);font-size:12.5px;font-weight:500}
.grid{gap:6px}
.dow{font-size:11.5px;font-weight:500;padding:6px 0}
.cell{border-radius:10px;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:500}
.cell.off{border-color:transparent}
.cell.ev{background:var(--panel)}
.cell b{width:7px;height:7px;border-radius:50%}
.cell em{font-size:11.5px;font-weight:500;line-height:1.25;color:var(--text)}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--c)}
.detail{border-radius:14px;border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);padding:26px;margin-top:24px}
.detail h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tag{border-radius:99px;padding:3px 10px;font-weight:600}
.list{margin-top:28px;gap:6px}
.row{border:1px solid var(--line);border-radius:10px;box-shadow:inset 3px 0 0 var(--c);padding:12px 16px;font-weight:500}
.row .dt{color:var(--mute);min-width:60px;font-variant-numeric:tabular-nums}
.brand{display:flex;gap:18px;align-items:center}
.logo{width:72px;height:72px;border-radius:14px;flex:none;border:1px solid var(--line)}
@media(max-width:520px){.logo{width:56px;height:56px}}
</style>
</head>
